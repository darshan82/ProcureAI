name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck & unit tests (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, web]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - if: matrix.app != 'web'
        run: npm test
      - if: matrix.app == 'web'
        run: npm run build

  e2e:
    name: Docker stack, live demos & eval gates
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and start the stack (offline mock LLM, no secrets needed)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Live demos (agent, security, ingestion, tenancy, streaming, contracts, integrations, MCP, ops)
        run: node scripts/demo.mjs all
      - name: Eval quality gates
        run: node evals/run.mjs
      - name: Eval report in job summary
        if: always()
        run: cat evals/reports/latest.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: evals/reports/
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200 api worker
      - if: always()
        run: docker compose down -v
